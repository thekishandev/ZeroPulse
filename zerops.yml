# ZeroPulse — zerops.yaml
# Build + runtime definition for this repo; standing Next.js artifact
# is emitted via `output: "standalone"` in next.config.ts.

zerops:
  - setup: frontend
    build:
      base: nodejs@22
      buildCommands:
        - npm ci
        - npm run build
      deployFiles:
        - .next/standalone/
      cache:
        - node_modules
        - .next/cache
    run:
      base: nodejs@22
      ports:
        - port: 3000
          protocol: TCP
          httpSupport: true
      start: node server.js
      envVariables:
        DATABASE_URL: ${db_connectionString}
        MOCK_MODE: "false"
        NODE_ENV: "production"
        HOSTNAME: "0.0.0.0"
        PORT: "3000"
