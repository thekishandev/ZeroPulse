# ZeroPulse — zerops.yaml
# Build & deploy pipeline for runtime services.

zerops:
  # ── Frontend (Next.js SSR) ─────────────────────────────────────────────
  - setup: frontend
    build:
      base: nodejs@22
      buildCommands:
        - npm ci
        - npm run build
      deployFiles:
        - .next/standalone
        - .next/static
        - public
        - package.json
        - package-lock.json
      cache:
        - node_modules
        - .next/cache
    run:
      base: nodejs@22
      ports:
        - port: 3000
          protocol: TCP
          httpSupport: true
      start: node server.js
      envVariables:
        DATABASE_URL: ${db_connectionString}
        MOCK_MODE: "false"
        NODE_ENV: "production"
        HOSTNAME: "0.0.0.0"
        PORT: "3000"

  # ── Worker — private background service ────────────────────────────────
  # The repo does not contain a server.js worker. Keep the worker service as a
  # runtime-only Next.js process instead of pointing it at a non-existing file.
  - setup: worker
    build:
      base: nodejs@22
      buildCommands:
        - npm ci
        - npm run build
      deployFiles:
        - .next/standalone
        - .next/static
        - public
        - package.json
        - package-lock.json
      cache:
        - node_modules
        - .next/cache
    run:
      base: nodejs@22
      start: node server.js
      envVariables:
        DATABASE_URL: ${db_connectionString}
        MOCK_MODE: "false"
        NODE_ENV: "production"
        ZEROPULSE_WORKER: "true"
