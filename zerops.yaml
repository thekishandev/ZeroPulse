# ZeroPulse — zerops.yaml
# The Zerops project, watching itself.

zerops:
  # ── Frontend (Next.js SSR — standalone mode) ────────────────────────────
  - setup: frontend
    build:
      base: nodejs@22
      os: ubuntu
      buildCommands:
        - npm ci
        - npm run build
        - cp -r .next/static .next/standalone/.next/static
        - cp -r public .next/standalone/public
      deployFiles:
        - .next/standalone/~
    run:
      base: nodejs@22
      os: ubuntu
      ports:
        - port: 3000
          httpSupport: true
      initCommands:
        - npx drizzle-kit push
      start: node server.js
      envVariables:
        DATABASE_URL: ${db_connectionString}
        MOCK_MODE: "false"
        NODE_ENV: "production"
        HOSTNAME: "0.0.0.0"
        PORT: "3000"
      healthCheck:
        httpGet:
          port: 3000
          path: /api/health

  # ── PostgreSQL 16 (private) ─────────────────────────────────────────────
  - setup: db
    run:
      base: postgresql@16

  # ── Valkey 7 cache (private) ────────────────────────────────────────────
  - setup: cache
    run:
      base: valkey@7

  # ── Worker — background snapshot poller (private) ───────────────────────
  - setup: worker
    build:
      base: nodejs@22
      os: ubuntu
      buildCommands:
        - npm ci
        - npm run build
        - cp -r .next/static .next/standalone/.next/static
        - cp -r public .next/standalone/public
      deployFiles:
        - .next/standalone/~
    run:
      base: nodejs@22
      os: ubuntu
      start: node server.js
      envVariables:
        DATABASE_URL: ${db_connectionString}
        MOCK_MODE: "false"
        NODE_ENV: "production"
        ZEROPULSE_WORKER: "true"

  # ── Object Storage (private) ────────────────────────────────────────────
  - setup: storage
    run:
      base: object-storage
      objectStorageSize: 2
