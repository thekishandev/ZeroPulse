# ZeroPulse — zerops.yaml
# Build & deploy pipeline for runtime services.
# Conforms to official Zerops JSON Schema.

zerops:
  # ── Frontend (Next.js SSR — standalone mode) ────────────────────────────
  - setup: frontend
    build:
      base: ubuntu/nodejs@22
      buildCommands:
        - npm ci
        - npm run build
        - mkdir -p .next/standalone/.next
        - cp -r .next/static .next/standalone/.next/static
        - cp -r public .next/standalone/public
      deployFiles:
        - .next/standalone/~
    run:
      base: ubuntu/nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      initCommands:
        - npx drizzle-kit push
      start: node server.js
      envVariables:
        DATABASE_URL: ${db_connectionString}
        MOCK_MODE: "false"
        NODE_ENV: "production"
        HOSTNAME: "0.0.0.0"
        PORT: "3000"
      healthCheck:
        httpGet:
          port: 3000
          path: /api/health

  # ── Worker — background snapshot poller (private) ───────────────────────
  - setup: worker
    build:
      base: ubuntu/nodejs@22
      buildCommands:
        - npm ci
        - npm run build
        - mkdir -p .next/standalone/.next
        - cp -r .next/static .next/standalone/.next/static
        - cp -r public .next/standalone/public
      deployFiles:
        - .next/standalone/~
    run:
      base: ubuntu/nodejs@22
      start: node server.js
      envVariables:
        DATABASE_URL: ${db_connectionString}
        MOCK_MODE: "false"
        NODE_ENV: "production"
        ZEROPULSE_WORKER: "true"
